# Edit first.

# Upload links carry the key that decrypts the file, so keep them out of the
# access log (map must sit outside server {}, in the http context)
map $request_uri $paste_loggable {
    ~^/(img/|filehost)  0;
    default             1;
}

server {
    server_name paste.boxlabs.uk;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    root /home/web/paste.boxlabs.uk;
    access_log /var/log/nginx/paste_access.log combined if=$paste_loggable;
    error_log /var/log/nginx/paste_error.log;
    client_max_body_size 0;
    index index.php index.html index.htm;

    include mime.types;
    default_type text/plain;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Stored uploads are only served through filehost.php and img/index.php
    location ^~ /filehost_files/ {
        deny all;
    }

    # PHP handling
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_buffers 8 16k;
        fastcgi_buffer_size 32k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    # Static files
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
    }

    # Named routes
    location ~ ^/page/([a-zA-Z0-9]+)/?$ {
        rewrite ^/page/([a-zA-Z0-9]+)/?$ /pages.php?page=$1 last;
    }

    location = /archive {
        rewrite ^ /archive.php last;
    }

    location = /profile {
        rewrite ^ /profile.php last;
    }

    location ~ ^/user/([^/]+)/?$ {
        rewrite ^/user/([^/]+)/?$ /user.php?user=$1 last;
    }

    location ~ ^/download/(.+)$ {
        rewrite ^/download/(.+)$ /paste.php?download&id=$1 last;
    }

    # FILEHOST (IRC uploads, see docs/filehost.md); raise client_max_body_size
    # and PHP post_max_size to at least FILEHOST_MAX_BYTES

    location = /filehost {
        rewrite ^ /filehost.php last;
    }
    
    location ^~ /filehost/ {
        rewrite "^/filehost/([A-Za-z0-9]{6,32}\.[a-z0-9]{1,8})$" /filehost.php?f=$1 last;
    }
    
    # Image and video uploads (/img). PHP upload_max_filesize and post_max_size
    # must allow the largest upload (img/.user.ini sets them for php-fpm)
    location ^~ /img/ {
        rewrite "^/img/([A-Za-z0-9]{6,32})\.([a-z0-9]{1,8})$" /img/index.php?f=$1.$2 last;
        rewrite "^/img/([A-Za-z0-9]{6,32})/?$" /img/index.php?v=$1 last;

        location ~ /\. {
            deny all;
        }

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_read_timeout 300;
        }

        try_files $uri $uri/ =404;
    }

    location ~ ^/raw/(.+)$ {
        rewrite ^/raw/(.+)$ /paste.php?raw&id=$1 last;
    }

    location ~ ^/embed/(.+)$ {
        rewrite ^/embed/(.+)$ /paste.php?embed&id=$1 last;
    }

location / {
    try_files $uri $uri/ @paste;
}

# Paste ID handler (reached when file doesn't exist)
location @paste {
    rewrite ^/([a-zA-Z0-9]+)/?$ /paste.php?id=$1 last;
    return 404;  # Only return 404 if it doesn't match the paste pattern
}
    ssl_certificate /etc/letsencrypt/live/boxlabs.uk-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boxlabs.uk-0001/privkey.pem;
}
